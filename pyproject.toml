[project]
name = "claudinator"
version = "0.1.0"
description = "A permanent, searchable archive of every Claude Code transcript on this Mac"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
claudinator = "claudinator.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
